[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata. Runtime dependencies are managed via requirements/*.txt to
# support environment-specific pinned installs; this table holds metadata and
# tooling configuration only.
# ---------------------------------------------------------------------------
[project]
name = "fastapi-enterprise-backend"
version = "0.1.0"
description = "Production-ready FastAPI backend foundation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }
authors = [{ name = "Engineering" }]

[tool.setuptools]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — linter (and import sorting via the `I` rules).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ASYNC",# flake8-async
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
]
ignore = [
    "S101",   # assert used (allowed in tests)
    "B008",   # function call in default arg (FastAPI Depends/Query idiom)
    "N818",   # base exception intentionally named `AppException`
    "UP046",  # keep `Generic[T]` for Pydantic model compatibility
    "UP047",  # keep classic generic function syntax
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
# conftest must set env vars before the app modules are imported.
"tests/conftest.py" = ["E402"]
# Settings intentionally use SCREAMING attribute/property names and hold
# non-secret local-dev defaults (a dev DB password, binding to all interfaces).
"app/config/*" = ["N802", "N815", "S104", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Black — code formatter.
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py313"]
extend-exclude = "migrations/versions"

# ---------------------------------------------------------------------------
# isort — import sorter (Black-compatible profile).
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["app"]
skip_glob = ["migrations/versions/*"]

# ---------------------------------------------------------------------------
# mypy — static type checker.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["celery.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"

# ---------------------------------------------------------------------------
# coverage.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/main.py", "migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

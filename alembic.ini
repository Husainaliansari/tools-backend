# Alembic configuration.
#
# The database URL is intentionally NOT set here. It is injected at runtime from
# the application settings (see migrations/env.py), keeping secrets and
# environment-specific values out of version control (Twelve-Factor App).

[alembic]
# Path to migration scripts, relative to this file.
script_location = migrations

# Template used to generate migration file names (timestamp + slug).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Make the project importable so `from app...` works inside env.py.
prepend_sys_path = .

# Use OS-native path separators.
version_path_separator = os

# Timezone for migration timestamps.
timezone = UTC

# sqlalchemy.url is populated programmatically in migrations/env.py.
sqlalchemy.url =


# ----------------------------------------------------------------------------
# Logging configuration (used by Alembic's own CLI output).
# ----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
